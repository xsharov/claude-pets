name: Build

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: claude-pets
          path: build/release/claude-pets.exe
          if-no-files-found: error
