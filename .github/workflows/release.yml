name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: Exact version, for example 2.0.0. Empty bumps the patch number.
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          $requested = "$env:REQUESTED".Trim().TrimStart('v')
          if (-not $requested -and (git tag --points-at HEAD --list 'v*')) {
            Write-Host 'This commit is already released.'
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $latest = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) } |
            Sort-Object |
            Select-Object -Last 1
          if ($requested) {
            $next = $requested
          } elseif (-not $latest) {
            $next = '1.0.0'
          } else {
            $labels = @(gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls" --jq '.[].labels[].name')
            if ($labels -contains 'major') {
              $next = "$($latest.Major + 1).0.0"
            } elseif ($labels -contains 'minor') {
              $next = "$($latest.Major).$($latest.Minor + 1).0"
            } else {
              $next = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
            }
          }
          if ($next -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.2.3, got '$next'."
          }
          if (git tag --list "v$next") {
            throw "Tag v$next already exists."
          }
          Write-Host "Releasing $next"
          "skip=false" >> $env:GITHUB_OUTPUT
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: Build
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Package
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          $package = "claude-pets-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path build/release/claude-pets.exe, README.md, LICENSE -DestinationPath $package
          "PACKAGE=$package" >> $env:GITHUB_ENV

      - name: Publish
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag $env:PACKAGE --target $env:GITHUB_SHA --title $tag --generate-notes
